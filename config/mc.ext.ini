# Midnight Commander: F3 on .svg renders via chafa (Apple Terminal half-blocks)

type/^SVG
	Open=chafa --format symbols --symbols block+border-solid -s $(stty size | awk '{print $2}')x40 %f
	View=%view{ascii} chafa --format symbols --symbols block+border-solid -s $(stty size | awk '{print $2}')x$(stty size | awk '{print $1}') %f

regex/\.svg$
	View=%view{ascii} chafa --format symbols --symbols block+border-solid -s $(stty size | awk '{print $2}')x$(stty size | awk '{print $1}') %f

include/svg
	Open=chafa --format symbols --symbols block+border-solid -s 80x40 %f
	View=%view{ascii} chafa --format symbols --symbols block+border-solid -s 80x40 %f
